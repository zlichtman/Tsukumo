      - path: ../ios/KemoSabe/OwnVoice.swift
      - path: ../ios/KemoSabe/OwnVoiceAudio.swift
      - path: ../ios/KemoSabe/NeuralVoiceSettings.swift
      - path: ../ios/KemoSabe/VoiceChooser.swift
      - path: ../ios/KemoSabe/AboutVoices.swift
      - path: ../ios/KemoSabe/OnDeviceWhisper.swift
      - path: ../ios/KemoSabe/ArtworkCompanion.swift
      - path: ../ios/KemoSabe/ArtworkPerformance.swift
      - path: ../ios/KemoSabe/AnimationGallery.swift
      - path: ../ios/KemoSabe/Assistant.swift
      - path: ../ios/KemoSabe/BrandStyle.swift
      - path: ../ios/KemoSabe/CharacterArtwork.swift
      - path: ../ios/KemoSabe/ChatComponents.swift
      - path: ../ios/KemoSabe/ChatStage.swift
      - path: ../ios/KemoSabe/ChatComposerPanel.swift
      # The chat model chip's power-up picker, shared with Tsukumo's coding slider.
