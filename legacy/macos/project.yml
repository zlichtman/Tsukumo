      - path: ../ios/KemoSabe/PeopleMedia.swift
      - path: ../ios/KemoSabe/AccountSync.swift
      - path: ../ios/KemoSabe/CloudKitSync.swift
      - path: ../ios/KemoSabe/SyncService.swift
      - path: ../ios/KemoSabe/KemoNotifications.swift
      - path: ../ios/KemoSabe/AppStoreSync.swift
      - path: ../ios/KemoSabe/Collaboration.swift
      - path: ../ios/KemoSabe/DayCalendar.swift
      # Reply voices behind one speech-engine boundary: Apple, OpenAI, Kokoro, and your own voice.
