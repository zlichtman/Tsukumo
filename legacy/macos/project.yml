      - path: ../ios/KemoSabe/LayaModel.swift
      - path: ../ios/KemoSabe/JevDecisionProvider.swift
      - path: ../ios/KemoSabe/SystemOne.swift
      - path: ../ios/KemoSabe/SystemOnePersonal.swift
      - path: ../ios/KemoSabe/SystemOneViews.swift
      - path: ../ios/KemoSabe/TrainingViews.swift
      - path: ../ios/KemoSabe/DailyAssistant.swift
      - path: ../ios/KemoSabe/KnowledgeVault.swift
      - path: ../ios/KemoSabe/MemoryContextBridge.swift
      - path: ../ios/KemoSabe/ModelConnectionsView.swift
      - path: ../ios/KemoSabe/Models.swift
      - path: ../ios/KemoSabe/PeopleDirectory.swift
      - path: ../ios/KemoSabe/PeopleContacts.swift
      - path: ../ios/KemoSabe/PeopleView.swift
      - path: ../ios/KemoSabe/PickedImage.swift
      - path: ../ios/KemoSabe/MusicArtwork.swift
      - path: ../ios/KemoSabe/NativeRoutineTools.swift
      - path: ../ios/KemoSabe/NearbyDisclosure.swift
      - path: ../ios/KemoSabe/NearbyKemos.swift
      - path: ../ios/KemoSabe/NearbyLocalModel.swift
      - path: ../ios/KemoSabe/PersonalRoutineSettings.swift
      - path: ../ios/KemoSabe/PersonalDecisions.swift
      - path: ../ios/KemoSabe/PreferenceLearner.swift
      - path: ../ios/KemoSabe/PropArtwork.swift
      - path: ../ios/KemoSabe/RoutineLedger.swift
      - path: ../ios/KemoSabe/RoutineStore.swift
      - path: ../ios/KemoSabe/RoutineTasks.swift
      - path: ../ios/KemoSabe/VoiceCommands.swift
      - path: ../ios/KemoSabe/VoicePolicy.swift
      - path: ../ios/KemoSabe/WritingArtwork.swift
      - path: ../ios/KemoSabe/WritingMotion.swift
      - path: ../ios/KemoSabe/KemoArtwork.metal
      - path: ../ios/KemoSabe/Resources/Character
        type: folder
        buildPhase: resources
      - path: ../ios/KemoSabe/Resources/Assets.xcassets
        buildPhase: resources
      - path: ../ios/KemoSabe/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../ios/KemoSabe/Resources/Laya-NOTICE.txt
        buildPhase: resources
      - path: ../ios/KemoSabe/Resources/ThinkingOrbs-LICENSE.txt
        buildPhase: resources
      - path: ../ios/KemoSabe/Resources/VoiceEngines-NOTICE.txt
        buildPhase: resources
      - path: ../ios/KemoSabe/Resources/AgentLogos-NOTICE.txt
        buildPhase: resources
      - path: ../ios/KemoSabe/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      # The KemoSabe MCP server agents start over stdio: Tsukumo.app/Contents/Helpers/kemosabe-mcp.
      - target: kemosabe-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: SwiftTerm
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftTransformers
        product: Hub
      - package: MLXAudio
        product: MLXAudioTTS
      - package: MLXAudio
        product: MLXAudioCore
      # On-device Whisper transcription (design/VOICE-ENGINES.md#on-device-whisper-september-26-2026).
      - package: MLXAudio
        product: MLXAudioSTT
    settings:
      base:
        PRODUCT_NAME: Tsukumo
        PRODUCT_MODULE_NAME: KemoSabeMac
        PRODUCT_BUNDLE_IDENTIFIER: com.zlichtman.kemosabe.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: KemoSabeMac/Info.plist
        TSUKUMO_ENTITLEMENTS_YES_NO: KemoSabeMac/KemoSabeMac-SignInWithApple.entitlements
        TSUKUMO_ENTITLEMENTS_YES_YES: KemoSabeMac/KemoSabeMac-Sync.entitlements
        TSUKUMO_ENTITLEMENTS_NO_NO: KemoSabeMac/KemoSabeMac.entitlements
        TSUKUMO_ENTITLEMENTS_NO_YES: KemoSabeMac/KemoSabeMac.entitlements
        CODE_SIGN_ENTITLEMENTS: $(TSUKUMO_ENTITLEMENTS_$(KEMO_SIGN_IN_WITH_APPLE)_$(KEMO_ICLOUD_SYNC))
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
  # A small stdio MCP server with one tool, ask_kemosabe, relaying to the running app over a Unix
  # socket only this user can open. It holds and reads no data.
  kemosabe-mcp:
    type: tool
    platform: macOS
    sources:
      - path: KemoSabeMCP
    settings:
      base:
        PRODUCT_NAME: kemosabe-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.zlichtman.kemosabe.mac.mcp
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
  KemoSabeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: ../ios/Tests/APIModelTests.swift
      - path: ../ios/Tests/PeopleAndImagesTests.swift
      - path: ../ios/Tests/ContextPagingTests.swift
      - path: ../ios/Tests/ContextPolicyTests.swift
      - path: ../ios/Tests/AgentRequestTests.swift
      - path: ../ios/Tests/ContextPacketTests.swift
      - path: ../ios/Tests/AgentQuestionTests.swift
      - path: ../ios/Tests/PersonalSourcesTests.swift
      - path: ../ios/Tests/MacRelayProtocolTests.swift
      - path: ../ios/Tests/SpeechEngineTests.swift
      - path: ../ios/Tests/OnDeviceWhisperTests.swift
      - path: ../ios/Tests/OnboardingTests.swift
      - path: ../ios/Tests/RoutingTests.swift
      - path: ../ios/Tests/PrivateCloudTests.swift
      - path: ../ios/Tests/ModelEffortTests.swift
      - path: ../ios/Tests/DayRangeTests.swift
      - path: ../ios/Tests/PersonalizationSettingsTests.swift
      - path: ../ios/Tests/DocsTests.swift
      - path: ../ios/Tests/ChatStageTests.swift
      - path: ../ios/Tests/OwnVoiceTrainingTests.swift
      - path: ../ios/Tests/SystemOneTests.swift
      - path: ../ios/Tests/SystemOneActivationTests.swift
      - path: ../ios/Tests/SystemOnePersonalTests.swift
      - path: ../ios/Tests/LayaEvaluationTests.swift
      - path: ../ios/Tests/ModelsPageTests.swift
    dependencies:
      - target: KemoSabeMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zlichtman.kemosabe.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tsukumo.app/Contents/MacOS/Tsukumo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  KemoSabeMac:
    build:
      targets:
        KemoSabeMac: all
    test:
      targets: [KemoSabeMacTests]
    archive:
      config: Release
