name: KemoSabeMac
options:
  bundleIdPrefix: com.zlichtman
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 28LJG7MXT3
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 77
    # Sign in with Apple: YES signs with KemoSabeMac-SignInWithApple.entitlements and shows the
    # button. Turn on only after the App ID has the capability and provisioning is regenerated.
    KEMO_SIGN_IN_WITH_APPLE: 'YES'
    # Account sync (iCloud, CloudKit): YES signs with KemoSabeMac-Sync.entitlements (adds the container
    # iCloud.com.zlichtman.kemosabe) and lets the app sync. Needs KEMO_SIGN_IN_WITH_APPLE too. Turn on
    # only once the container exists and is assigned to the App ID. KEMO_CLOUDKIT_ENVIRONMENT keeps the
    # development-signed Mac app in the same CloudKit environment as the iPhone's TestFlight builds.
    KEMO_ICLOUD_SYNC: 'YES'
    # Private Cloud needs Apple's managed entitlement; without it FoundationModels traps on device.
    KEMO_PRIVATE_CLOUD: 'NO'
    KEMO_CLOUDKIT_ENVIRONMENT: Production
packages:
  # Terminal emulator for Tsukumo (MIT). Pinned; reviewed September 24, 2026, including its
  # build plugin, which only reads its own git metadata to generate a version file.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    revision: 9088d55148b799e853cf4e039b0f0a1e3efe034c
  # On-device neural voices (MIT), shared with the iPhone. See design/VOICE-ENGINES.md.
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift.git
    revision: 01dec7c9bdce3088a6b6b7ab9f2e403458195efb
targets:
  KemoSabeMac:
    type: application
    platform: macOS
