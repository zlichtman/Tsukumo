      - path: ../ios/KemoSabe/ShortcutsIntegration.swift
      - path: ../ios/KemoSabe/ConversationModel.swift
      - path: ../ios/KemoSabe/AppleCloudModel.swift
      - path: ../ios/KemoSabe/ExplicitRequest.swift
      - path: ../ios/KemoSabe/ConversationRuntime.swift
      - path: ../ios/KemoSabe/CoreMLLayaProvider.swift
      # System One: Laya on this device (with the person's own layer), Jev with the person's key
