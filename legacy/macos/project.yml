      - path: ../ios/KemoSabe/AgentRequest.swift
      - path: ../ios/KemoSabe/AgentRequestCard.swift
      # Context packets: a chat's context moving to another chat, an agent, or a Tsukumo task (design/CONTEXT-HARNESS.md#context-packets).
      - path: ../ios/KemoSabe/ContextPacket.swift
