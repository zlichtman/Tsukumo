      - path: ../ios/KemoSabe/Onboarding.swift
      - path: ../ios/KemoSabe/AccountStore.swift
      - path: ../ios/KemoSabe/AccountDirectory.swift
      - path: ../ios/KemoSabe/AccountSession.swift
      - path: ../ios/KemoSabe/SettingsCatalog.swift
      - path: ../ios/KemoSabe/CompanionPaletteTile.swift
      - path: ../ios/KemoSabe/VoiceGlow.swift
      # Docs and Journal in Library, shared with the iPhone (design/DOCS-AND-JOURNAL.md).
      - path: ../ios/KemoSabe/DocsModel.swift
      - path: ../ios/KemoSabe/DocMarkdown.swift
      - path: ../ios/KemoSabe/JournalModel.swift
      - path: ../ios/KemoSabe/DocsStore.swift
      - path: ../ios/KemoSabe/DocsAttachments.swift
      - path: ../ios/KemoSabe/DocEditor.swift
      - path: ../ios/KemoSabe/DocPageEditor.swift
      - path: ../ios/KemoSabe/JournalViews.swift
      - path: ../ios/KemoSabe/DocAttachmentViews.swift
      - path: ../ios/Vendor/ThinkingOrbs
