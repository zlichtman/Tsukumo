      - path: ../ios/KemoSabe/MacRelay.swift
      - path: ../ios/KemoSabe/MacRelayNetwork.swift
      - path: ../ios/KemoSabe/MacRelaySession.swift
      - path: ../ios/KemoSabe/MacRelaySync.swift
      - path: KemoSabeMCP/KemoSabeBridgeWire.swift
